<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#081c16" />
  <meta name="description" content="Yasser TANANE — Store Manager at GO212. Call, WhatsApp, Instagram and save contact." />
  <meta property="og:title" content="Yasser TANANE | GO212" />
  <meta property="og:description" content="Store Manager at GO212 — Digital Business Card" />
  <meta property="og:image" content="assets/background.jpg" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <title>Yasser TANANE | GO212</title>
  <style>
    :root{color-scheme:dark;--green:#22d96d;--ink:#fff;--glass:rgba(22,39,32,.63);--border:rgba(255,255,255,.22)}
    *{box-sizing:border-box}
    html{min-height:100%;background:#081c16}
    body{margin:0;min-height:100vh;font-family:'DM Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink)}
    .background{position:fixed;inset:0;z-index:-2;background-image:url('assets/background.jpg');background-size:cover;background-position:center 34%;}
    .background:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,19,14,.44) 0%,rgba(4,19,14,.67) 40%,rgba(4,19,14,.90) 100%)}
    main{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:clamp(25px,6vh,80px) 20px 32px}
    .content{width:min(100%,440px);display:flex;flex-direction:column;align-items:center;text-align:center}
    .avatar{width:148px;height:148px;object-fit:cover;object-position:center 40%;border:4px solid var(--green);border-radius:50%;box-shadow:0 7px 28px rgba(0,0,0,.34);background:#12351f}
    h1{font-size:clamp(35px,8vw,48px);font-weight:800;letter-spacing:-1.8px;line-height:1.06;margin:23px 0 10px;text-shadow:0 2px 15px #0008}
    .accent{height:5px;width:72px;background:var(--green);border-radius:5px;margin:11px 0 16px}
    .position{font-weight:500;font-size:clamp(17px,4vw,22px);margin:0 0 29px;color:#f2f7f3}
    .links{display:grid;gap:13px;width:100%}
    a.action{display:flex;align-items:center;gap:17px;min-height:70px;padding:12px 18px;border:1px solid var(--border);border-radius:20px;text-decoration:none;color:#fff;text-align:left;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 4px 18px rgba(0,0,0,.13);transition:transform .18s,background .18s}
    a.action:hover,a.action:focus-visible{transform:translateY(-2px);background:rgba(44,69,55,.8);outline:none}
    a.action.whatsapp{background:linear-gradient(125deg,#1bbd51,#078638);border-color:#54ec86}
    a.action.whatsapp:hover{background:linear-gradient(125deg,#25d366,#159748)}
    a.action.save{border-color:rgba(77,233,132,.62)}
    .ico{width:40px;height:40px;flex:none;display:grid;place-items:center}
    .ico svg{width:32px;height:32px;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round}
    .ico.instagram svg{stroke:#fc8eb3}
    .txt{flex:1;min-width:0}.primary{display:block;font-weight:700;font-size:18px;letter-spacing:-.3px}.secondary{display:block;font-size:12px;opacity:.87;margin-top:3px;overflow-wrap:anywhere}
    .arrow{width:21px;height:21px;opacity:.8;flex:none}
    .brand{font-size:25px;letter-spacing:-1.1px;font-weight:800;margin-top:34px}.brand span{color:var(--green)}
    footer{font-size:12px;opacity:.6;margin-top:9px}
    @media (max-width:380px){main{padding:25px 16px}.avatar{width:125px;height:125px}h1{font-size:35px}.links{gap:10px}a.action{min-height:62px;padding:10px 13px}.primary{font-size:16px}}
    @media (min-height:900px){.avatar{width:165px;height:165px}.position{margin-bottom:35px}.links{gap:17px}a.action{min-height:77px}}
    @media (prefers-reduced-motion:reduce){a.action{transition:none}}
  </style>
</head>
<body>
  <div class="background" aria-hidden="true"></div>
  <main><div class="content">
    <img class="avatar" src="assets/profile.jpg" alt="Yasser TANANE profile photo" width="148" height="148" />
    <h1>Yasser TANANE</h1><div class="accent" aria-hidden="true"></div>
    <p class="position">Store Manager at GO212</p>
    <nav class="links" aria-label="Contact Yasser">

        <span class="txt"><span class="primary">0612636839</span><span class="secondary">Tap to call</span></span><span class="arrow">↗</span>

        <span class="txt"><span class="primary">WhatsApp Me</span><span class="secondary">Start a new conversation</span></span><span class="arrow">↗</span>
      </a>
      <a class="action" href="https://www.instagram.com/palermo2005tn/" target="_blank" rel="noopener noreferrer" aria-label="Open Instagram @palermo2005tn">
        <span class="ico instagram"><svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="18" cy="6" r=".6" fill="currentColor" stroke="none"/></svg></span>
        <span class="txt"><span class="primary">@palermo2005tn</span><span class="secondary">Instagram</span></span><span class="arrow">↗</span>
      </a>
      <a class="action save" href="yasser-tanane.vcf" download="Yasser-TANANE.vcf" type="text/vcard" aria-label="Save Yasser to your phone contacts">
        <span class="ico"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><circle cx="12" cy="9" r="2.5"/><path d="M8 17c0-3 8-3 8 0M2 8h2M2 13h2"/></svg></span>
        <span class="txt"><span class="primary">Save Contact</span><span class="secondary">Add Yasser to your phone</span></span><span class="arrow">↓</span>
      </a>
    </nav>
    <div class="brand"><span>GO</span>212</div>
    <footer>Digital Business Card</footer>
  </div></main>
</body>
</html>
